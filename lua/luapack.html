<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LuaPack Downloads</title>
  <style>
    body {
      background: #0d0d0d;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      backdrop-filter: blur(8px);
    }

    .container {
      background: rgba(20, 20, 20, 0.85);
      padding: 2rem 2.5rem;
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(0, 255, 120, 0.05);
      max-width: 600px;
      width: 100%;
    }

    .discord-link {
      display: block;
      background: #5865F2;
      color: #fff;
      text-align: center;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      margin-bottom: 1rem;
      font-weight: bold;
      transition: background 0.2s;
    }

    .discord-link:hover {
      background: #4752c4;
    }

    h1 {
      text-align: center;
      margin-bottom: 0.4rem;
      color: #0f0;
      font-size: 1.6rem;
    }

    .note {
      margin-bottom: 1rem;
      font-size: 0.95rem;
      text-align: center;
      color: #aaa;
    }

    .search-bar {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: none;
      border-radius: 8px;
      background: #111;
      color: #eee;
      font-size: 0.9rem;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      border-bottom: 1px solid #333;
      padding: 0.5rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .filename {
      color: #eee;
      font-size: 0.95rem;
    }

    .download-link {
      color: #0f0;
      cursor: pointer;
      font-size: 0.85rem;
      transition: color 0.2s;
    }

    .download-link:hover {
      color: #0c0;
    }

    .error {
      color: #f55;
      text-align: center;
      margin-top: 1rem;
    }
  </style>
  <script>
    const githubUser = "KayaHvH";
    const repo = "Configs";
    const branch = "main";
    const folder = "lua/luapack";
    let luaFiles = [];

    async function loadLuaPack() {
      const fileList = document.getElementById("file-list");
      const error = document.getElementById("error");

      try {
        const apiURL = `https://api.github.com/repos/${githubUser}/${repo}/contents/${folder}`;
        const res = await fetch(apiURL);
        const data = await res.json();

        if (!Array.isArray(data)) throw new Error("Unexpected API response");

        luaFiles = data.filter(f => f.name.endsWith(".lua"));
        if (luaFiles.length === 0) {
          fileList.innerHTML = "<li>No Lua files found.</li>";
          return;
        }

        renderFiles(luaFiles);

      } catch (e) {
        console.error(e);
        error.textContent = "❌ Failed to load Lua files from GitHub.";
      }
    }

    function renderFiles(files) {
      const fileList = document.getElementById("file-list");
      fileList.innerHTML = "";
      files.forEach(file => {
        const li = document.createElement("li");

        const name = document.createElement("span");
        name.className = "filename";
        name.textContent = file.name;

        const download = document.createElement("span");
        download.className = "download-link";
        download.textContent = "Download";
        download.onclick = () => downloadLua(file.name);

        li.appendChild(name);
        li.appendChild(download);
        fileList.appendChild(li);
      });
    }

    function searchFiles(query) {
      const filtered = luaFiles.filter(f =>
        f.name.toLowerCase().includes(query.toLowerCase())
      );
      renderFiles(filtered);
    }

    async function downloadLua(filename) {
      const url = `https://raw.githubusercontent.com/${githubUser}/${repo}/${branch}/${folder}/${filename}`;
      const res = await fetch(url);
      const blob = await res.blob();
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    window.onload = () => {
      loadLuaPack();
      const search = document.getElementById("search");
      search.addEventListener("input", (e) => searchFiles(e.target.value));
    };
  </script>
</head>
<body>
  <div class="container">
    <a class="discord-link" href="https://discord.gg/Sf88yVvZgB" target="_blank">
      🌐 Join our Discord
    </a>
    <h1>LuaPack</h1>
    <div class="note">Click any file below to download it.</div>
    <input type="text" id="search" class="search-bar" placeholder="Search Lua files..." />
    <ul id="file-list"></ul>
    <div class="error" id="error"></div>
  </div>
</body>
</html>
